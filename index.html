<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS3</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flexboxgrid/6.3.1/flexboxgrid.min.css">
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: rgb(32, 4, 78);
            border: 2px solid #000000;
            color: white;
        }

        .caja {
            border: 2px solid #000000;
            height: 30vh;
        }

    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Uno</h2>
            </div>pull
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Dos</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Tres</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Cuatro</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Cinco</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Seis</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Siete</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Ocho</h2>
            </div>
            <div class="col-xs-4 col-sm-4 col-md-4 col-lg-4 caja">
                <h2>Nueve</h2>
            </div>
        </div>
    </div>
</body>
</html>
